name: CI and Android APK

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      build_apk:
        description: Build the Android APK and send it to Telegram after checks pass
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://recipe:ci_test_only@127.0.0.1:5432/socialrecipe_test?schema=public
      TEST_DATABASE_URL: postgresql://recipe:ci_test_only@127.0.0.1:5432/socialrecipe_test?schema=public
      SEED_ADMIN_EMAIL: ""
      SEED_ADMIN_PASSWORD: ""
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: recipe
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: socialrecipe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipe -d socialrecipe_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Generate Prisma client and prepare the isolated database
        run: |
          npm run db:generate
          npm run db:deploy
          npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and PostgreSQL integration tests
        # Integration suites update shared moderation policies; run files in sequence.
        run: npm test -- --no-file-parallelism --testTimeout=15000 --hookTimeout=15000
      - run: npm run build
      - name: Validate deployment shell scripts
        run: |
          sh -n deploy/nginx/40-configure-ssl.sh
          sh -n deploy/certbot/renew.sh
      - name: Build API and Nginx production images
        run: |
          docker build --target runtime -t socialrecipe-api:ci .
          docker build -t socialrecipe-nginx:ci deploy/nginx

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      # This CI bundle is a build check only; Vercel uses its own real API URL.
      VERCEL: "1"
      VITE_API_URL: https://api.example.com/api/v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  mobile:
    name: Mobile checks and bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_DOTENV: "1"
      EXPO_PUBLIC_API_URL: https://api.example.com/api/v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check Android JavaScript bundle
        run: npx expo export --platform android --output-dir dist/ci

  apk:
    name: Build APK and send to Telegram
    needs: [backend, frontend, mobile]
    if: >-
      ${{ github.ref == 'refs/heads/master' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.build_apk)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: mobile
    concurrency:
      group: android-apk-telegram
      cancel-in-progress: false
    env:
      EXPO_NO_DOTENV: "1"
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Check distribution secrets before starting a cloud build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for name in EXPO_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Add GitHub Actions secret $name. See mobile/README.md."
              exit 1
            fi
          done
      - run: npm ci
      - name: Install the pinned EAS CLI
        run: npm install --global eas-cli@25.2.0
      - name: Build a signed APK on EAS and wait for completion
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p builds
          eas build --platform android --profile preview --non-interactive --wait --json > builds/eas-result.json
      - name: Download this build's APK
        run: node scripts/distribute-apk.mjs download builds/eas-result.json builds/SocialRecipe-Hub.apk
      - name: Keep the APK in GitHub Actions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SocialRecipe-Hub-${{ github.sha }}
          path: mobile/builds/SocialRecipe-Hub.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Send APK or download link to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/distribute-apk.mjs send builds/eas-result.json builds/SocialRecipe-Hub.apk
